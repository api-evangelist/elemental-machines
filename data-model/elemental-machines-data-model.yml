gaps:
- No response schemas anywhere — the models block is empty in all twelve of the provider's Swagger
  1.2 declarations, so no field names, types, units or enumerations are published for any entity.
- Sensor measurement types (temperature, humidity, CO2, differential pressure, door state) are
  central to the product but appear nowhere in the contract.
- No write operations, so no create/update payload shapes exist to model.
