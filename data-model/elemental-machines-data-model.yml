summary: >-
  Entity-relationship graph for the Elemental Machines LabOps API. IMPORTANT CAVEAT ON PROVENANCE:
  the provider's Swagger 1.2 declarations carry an EMPTY models block on every resource, so there
  are no response schemas to read attributes from. Everything below is derived from path nesting and
  from the id-reference parameters (machine_uuid, uuid, customer_group_uuid) — the relationships are
  solid, but the per-entity attribute lists are deliberately left empty rather than invented.
identifiers:
  style: uuid
  parameters_observed: [uuid, machine_uuid, customer_group_uuid, 'machine_uuids[]']
  prefixed_ids: false
  note: No id prefixes are published; identifiers appear to be bare UUIDs.
entities:
- name: CustomerGroup
  description: The tenancy boundary. Machines, users and utilization rollups are all scoped to a group.
  operations: [customerGroupsIndex, customerGroupsMy]
  id_field: customer_group_uuid
  attributes: []
  attributes_note: No schema published.
- name: Machine
  description: >-
    A sensor-connected asset — a freezer, incubator, room, or third-party instrument. The root
    entity of the API; every time-series and alert read hangs off a machine.
  operations: [machinesIndex, machinesShow]
  id_field: uuid
  path: /api/machines/{uuid}.json
  attributes: []
  attributes_note: No schema published.
- name: MachineSample
  description: Raw sensor readings for one machine over a timestamp range.
  operations: [machineSamplesIndex]
  path: /api/machines/{machine_uuid}/samples.json
  window_params: [from, to, order, limit]
  attributes: []
- name: MachineSampleStat
  description: Computed minimum, maximum, mean and median sensor values for one machine over a range.
  operations: [machineSampleStatsIndex]
  path: /api/machines/{machine_uuid}/sample_stats.json
  window_params: [from, to]
  attributes: []
  note: A server-side aggregate of MachineSample — the API does the statistics so the client does not have to pull raw series.
- name: AlertLog
  description: Historical alert events raised against one machine.
  operations: [alertLogsIndex]
  path: /api/machines/{machine_uuid}/alert_logs.json
  window_params: [from, to, order, limit]
  attributes: []
- name: AlertRule
  description: >-
    Configured alert conditions. Filterable by managed_machine_uuid, which is the naming that ties a
    rule to the machine it watches.
  operations: [alertRulesIndex]
  path: /api/alert_rules.json
  filter_params: [managed_machine_uuid]
  attributes: []
- name: MachineUsage
  description: >-
    Utilization rollups computed per customer group in three shapes — aggregated, hourly, and
    current status. Filterable by location tags, equipment category tags, explicit machine UUIDs,
    and a working-hours calendar (time_zone, start_work_hour, end_work_hour, work_days[]).
  operations: [machinesUsageAggregated, machinesUsageHourly, machinesUsageStatus]
  path: /api/machines/usage/{shape}.json
  attributes: []
- name: User
  description: A dashboard user within a customer group.
  operations: [usersIndex, usersMy]
  attributes: []
- name: UserActivity
  description: >-
    Audit records of what users did, filterable by customer_group_uuid, usage_type and action_type
    over a from/to window. This is the machine-readable face of the company's 21 CFR Part 11 audit
    trail claim.
  operations: [userActivitiesIndex]
  attributes: []
- name: ReleaseNote
  description: Dated platform release notes, filterable by software and a date range.
  operations: [releaseNotesIndex]
  filter_params: [software, from_date, to_date]
  attributes: []
- name: ServiceStatus
  description: >-
    Unauthenticated subsystem health snapshot. This is the ONE entity whose real shape is
    observable, because the endpoint answers anonymously.
  operations: [statusCheck]
  attributes_observed: [alerts, sidekiq, gateway_whitelists, smart_context, prediction_statuses, balena_statuses]
  attributes_source: live GET https://api.elementalmachines.io/api/status/check.json (HTTP 200)
