apis:
- name: Elemental Machines API
  description: >-
    Public REST API for the Elemental Machines LabOps platform. Read machines (sensor-connected
    assets), their time-series samples and computed sample statistics, aggregated/hourly/status
    utilization rollups for a customer group, alert logs and alert rules, users, user activities and
    customer groups, plus dated platform release notes and an unauthenticated server status check.
    Authentication is OAuth 2.0 Resource Owner Password Credentials against /oauth/token; the
    resulting token is passed as an access_token query parameter on every call. The provider
    publishes a Swagger 1.2 contract and a Swagger UI console at api.elementalmachines.io.
  humanURL: https://api.elementalmachines.io/
  baseURL: https://api.elementalmachines.io
