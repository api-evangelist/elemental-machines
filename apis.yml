- name: Elemental Machines Website MCP Server
  description: >-
    A remote Model Context Protocol server served from the elementalmachines.com WordPress host via
    the WordPress MCP Adapter, advertised by /.well-known/oauth-protected-resource and
    /.well-known/oauth-authorization-server. It is a website/content MCP surface, NOT an interface to
    the LabOps API at api.elementalmachines.io. tools/list returns HTTP 401 with a Bearer
    WWW-Authenticate challenge, so the tool schemas require authenticated introspection.
  humanURL: https://elementalmachines.com/
  baseURL: https://elementalmachines.com/wp-json/mcp/mcp-oauth-server
