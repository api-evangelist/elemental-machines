aid: elemental-machines
name: Elemental Machines
description: >-
  Elemental Machines is a Cambridge, Massachusetts LabOps connectivity company that instruments
  laboratories and manufacturing floors with IoT sensors and a vendor-agnostic cloud platform for
  environmental monitoring, cold-storage and freezer health, equipment utilization, alerting,
  calibration and compliance reporting across life sciences R&D, biomanufacturing, academia and
  government facilities. The platform ingests sensor and third-party equipment data at 15-second
  resolution and exposes it through a public REST API at api.elementalmachines.io covering machines,
  machine samples and sample statistics, utilization (aggregated, hourly and status), alert logs,
  alert rules, users, user activities, customer groups, release notes and a server status check,
  authenticated with OAuth 2.0 access tokens. The same data is pushed into ELN/LIMS/SDMS, QMS, MES,
  BMS and CMMS systems and data warehouses through the company's data-integration services. The
  company is ISO 9001:2015 certified, operates calibration to ISO 17025, and positions the platform
  as a 21 CFR Part 11 / ALCOA+ compliant recording system for GxP-regulated laboratories.
