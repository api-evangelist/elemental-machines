  /api/machines/{machine_uuid}/sample_stats.json:
    get:
      tags:
      - Machines Sample Stats
      summary: Get sensor minimum, maximum, mean and median values
      operationId: machineSampleStatsIndex
      parameters:
      - name: access_token
        in: query
        description: Access token
        required: true
        schema:
          type: string
      - name: machine_uuid
        in: path
        description: Machine UUID
        required: true
        schema:
          type: string
      - name: from
        in: query
        description: Starting epoch timestamp in seconds. Blank will default to 24 hours ago.
        required: false
        schema:
          type: integer
      - name: to
        in: query
        description: Ending epoch timestamp in seconds. Blank will default to current time.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Not Authorized
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
      security:
      - access_token: []
  /api/machines/{machine_uuid}/samples.json:
