          help on multiple values, contact Customer Support.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: machine_uuids[]
        in: query
        description: Machine UUID filter.  Enter single parameter text value in this form (e.g. 454d60e3-05c3-4356-872e-fbd480fe91fa).  For
          help on multiple values, contact Customer Support.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: sort_by
        in: query
        description: One of equipment_name, eq_category, location, availability [availability is default]
        required: false
        schema:
          type: string
      - name: sort_direction
        in: query
        description: asc or desc [asc is default]
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Not Authorized
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
      security:
      - access_token: []
  /oauth/token:
    post:
      tags:
      - Authentication
      summary: Get access token
      description: An access token is needed for all subsequent authenticated requests. Contact us for Client ID/Secret.
      operationId: oauthToken
      parameters:
      - name: grant_type
        in: query
        description: Grant type
        required: false
        schema:
          type: string
          default: password
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  description: Email address
                  type: string
                password:
                  description: Password
                  type: string
                client_id:
                  description: Client ID
                  type: string
                client_secret:
                  description: Client secret
                  type: string
              required:
              - username
              - password
              - client_id
              - client_secret
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
      security: []
  /api/release_notes.json:
    get:
      tags:
      - Release Notes
      summary: Change logs for releases
      operationId: releaseNotesIndex
      parameters:
      - name: access_token
        in: query
        description: Access token
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number
        required: true
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        description: Number of results per page
        required: true
        schema:
          type: integer
          default: 10
      - name: software
        in: query
        description: Software. Default is all software if not specified.
        required: false
        schema:
          type: string
      - name: from_date
        in: query
        description: From date, e.g. 2022-09-30. Default is All Time if not specified.
        required: false
        schema:
          type: string
      - name: to_date
        in: query
        description: To date, e.g. 2022-10-31. Default is All Time if not specified.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
