      summary: Check server status
      operationId: statusCheck
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
      security: []
  /api/user_activities.json:
    get:
      tags:
      - User Activities
      summary: Get all user activities for your customer(s)
      operationId: userActivitiesIndex
      parameters:
      - name: access_token
        in: query
        description: Access token
        required: true
        schema:
          type: string
      - name: customer_group_uuid
        in: query
        description: UUID of Customer Group [empty = all]
        required: false
        schema:
          type: string
      - name: usage_type
        in: query
        description: Usage Type [dashboard, mobile, calendar; empty = all]
        required: false
        schema:
          type: string
      - name: action_type
        in: query
        description: Action Type [view, change, login, all; empty/default = change]
        required: false
        schema:
          type: string
      - name: from
        in: query
        description: Starting epoch timestamp in seconds [empty starts at 0, default is empty/0]
        required: false
        schema:
          type: integer
      - name: to
        in: query
        description: Ending epoch timestamp in seconds. Default value is current time.
        required: false
        schema:
          type: integer
          default: 1785278041
      - name: order
        in: query
        description: Order of activities returned [asc is default, desc is required to return most recent activities]
        required: false
        schema:
          type: string
          default: asc
      - name: limit
        in: query
        description: Number of activities to return [1 is minimum, 100 is default, 1200 is maximum]
        required: false
        schema:
          type: integer
          default: 100
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Not Authorized
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
      security:
      - access_token: []
  /api/users/my.json:
    get:
      tags:
      - Users
      summary: Get current user
      operationId: usersMy
      parameters:
      - name: access_token
        in: query
        description: Access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
