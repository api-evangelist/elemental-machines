        schema:
          type: integer
      - name: to
        in: query
        description: Ending epoch timestamp in seconds. Default value is current time.
        required: false
        schema:
          type: integer
          default: 1785278041
      - name: order
        in: query
        description: Order of samples returned [asc is default, desc is required to return most recent samples]
        required: false
        schema:
          type: string
          default: asc
      - name: limit
        in: query
        description: Number of samples to return [1 is minimum, 100 is default, 1200 is maximum]
        required: false
        schema:
          type: integer
          default: 100
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Not Authorized
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
      security:
      - access_token: []
  /api/machines.json:
    get:
      tags:
      - Machines
      summary: Get all machines
      operationId: machinesIndex
      parameters:
      - name: access_token
        in: query
        description: Access token
        required: true
