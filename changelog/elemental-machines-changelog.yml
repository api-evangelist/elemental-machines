summary: >-
  Elemental Machines maintains THREE separate release-note surfaces and none of them is a
  developer-facing API changelog. The marketing changelog at info.elementalmachines.com/release-notes
  is public and dated but has not been updated since November 2022. The current release notes live in
  the Freshdesk knowledge base, which is JS-rendered and reachable only through search. The most
  structured feed of all — GET /api/release_notes.json, with software, from_date, to_date, page and
  per_page filters — is inside the API itself and requires an access_token. No entry on any surface
  describes a change to the API contract; every one describes Dashboard, Calendar, Usage or Mobile
  app changes. There is no API changelog.
scheme: product-release-notes
versioning_observed: >-
  Per-app semantic-ish versions appear in the entries (Dashboard Release 3.79.0, 3.96.0;
  Calendar/Usage Release 1.10.0). These version the applications, NOT the REST API, which declares
  apiVersion 1.0 with no version segment in any URL.
current_api_version: '1.0'
surfaces:
- name: Public marketing changelog
  url: https://info.elementalmachines.com/release-notes
  http_status: 200
  public: true
  dated: true
  machine_readable: false
  entry_count_listed: 6
  newest_entry: '2022-11-21'
  stale: true
  note: >-
    Six entries total, newest dated November 21, 2022 (describing software released November 18,
    2022). Nearly four years without an update while the product demonstrably kept shipping — see
    the Freshdesk surface below.
- name: Freshdesk knowledge base — Releases
  url: https://elementalmachines.freshdesk.com/support/solutions
  http_status: 200
  public: true
  dated: true
  machine_readable: false
  note: >-
    This is where current release notes actually live, organized into monthly "Releases" folders
    (e.g. "August 2024 - Releases" at
    /support/solutions/articles/19000160661-dashboard-release-3-96-0-august-6-2024, plus 2025
    monthly folders). The portal renders client-side and exposes no folder index to an
    unauthenticated crawler, so individual articles are reachable only by search-engine hit, not by
    walking the site.
- name: Release notes API
  url: https://api.elementalmachines.io/api/release_notes.json
  operationId: releaseNotesIndex
  public: false
  auth_required: true
  machine_readable: true
  filters: [software, from_date, to_date, page, per_page]
  note: >-
    The most useful of the three — filterable, paginated, JSON — and the only one an integrator
    could poll. It is gated behind an OAuth access_token, so its contents cannot be recorded here.
