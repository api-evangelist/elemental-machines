summary: >-
  Elemental Machines has both an OpenAPI-describable REST surface and a live MCP server, so a
  crosswalk is emitted — but the two DO NOT MEET. The MCP server is a WordPress content MCP on the
  marketing host (elementalmachines.com); the REST API is the LabOps platform on a different host
  (api.elementalmachines.io). No tool on the MCP side is backed by any operation on the REST side,
  and the MCP tool list is auth-gated so it cannot even be enumerated. The whole 17-operation LabOps
  surface is therefore rest_only — there is currently NO agent-callable path to machines, samples,
  utilization or alerts. That gap is the finding.
