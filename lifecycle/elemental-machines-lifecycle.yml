summary: >-
  Elemental Machines runs a real Atlassian Statuspage with nine named components and publishes a
  dated release-notes feed through its own API, but it publishes NO versioning policy, NO deprecation
  policy, NO Sunset/Deprecation header commitment and NO public SLA. The API declares apiVersion 1.0
  with no version segment in any URL.
versioning:
  scheme: document-version-only
  current_version: '1.0'
  source: apiVersion in https://api.elementalmachines.io/docs/api-docs.json
  in_url: false
  in_header: false
  policy_published: false
  note: >-
    No /v1/ path segment, no Accept-version header, no documented policy on how a breaking change
    would be introduced or signalled. A consumer has no version to pin to.
deprecation:
  policy_published: false
  sunset_header: undocumented
  deprecation_header: undocumented
  rfc8594: false
  deprecated_operations: []
  note: >-
    No operation in the provider's Swagger 1.2 declarations is marked deprecated, and no deprecation
    or sunset policy page exists anywhere on elementalmachines.com or the API console. NO
    Deprecation pointer is emitted in apis.yml — there is no policy to point at.
