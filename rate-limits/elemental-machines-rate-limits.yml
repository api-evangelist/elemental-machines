exhaustion_status_code: undocumented
exhaustion_note: >-
  No 429 Too Many Requests is declared on any operation in the contract. The declared error codes
  are 400, 401, 403 and 404 only.
backoff_guidance: none published
practical_guidance:
  note: >-
    In the absence of a published limit, the pagination requirements are the only server-side brake
    a client can see: page and per_page are REQUIRED on the three utilization operations and on
    release notes, and the time-series reads accept an optional limit. Treat those as the intended
    request-shaping mechanism, window /samples.json reads narrowly with from/to, and prefer
    /sample_stats.json (server-side min/max/mean/median) over pulling raw series when only
    aggregates are needed.
  conditional_requests: >-
    Responses carry a weak ETag and cache-control max-age=0, private, must-revalidate, so
    If-None-Match revalidation is available and is the cheapest way to poll without re-transferring
    unchanged payloads.
  correlation: >-
    Every response carries an x-request-id (Rails). Log it — it is the only handle support has for
    diagnosing a throttled or failed call.
