summary: >-
  Elemental Machines documents NO rate limits and emits NO rate-limit headers. The provider's
  Swagger 1.2 declarations do not declare a 429 response on any of the seventeen operations, and a
  live unauthenticated call to the status endpoint returns no RateLimit-*, X-RateLimit-* or
  Retry-After header. A client therefore has no documented limit to respect and no runtime signal to
  back off on — it can only infer throttling from an undocumented failure.
